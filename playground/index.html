<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gift Player Playground</title>
    <style>
      :root { color-scheme: light dark; --bd: #8884; --muted: #888; }
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 1100px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      #drop { border: 2px dashed var(--bd); border-radius: 8px; padding: 24px; text-align: center; color: var(--muted); }
      #drop.over { border-color: #3b82f6; color: inherit; }
      .row { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
      table { border-collapse: collapse; margin: 12px 0; }
      td { border: 1px solid var(--bd); padding: 4px 10px; }
      td:first-child { color: var(--muted); }
      #warnings { color: #b45309; white-space: pre-wrap; font-size: 12px; }
      #error { color: #dc2626; white-space: pre-wrap; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
      .cell { border: 1px solid var(--bd); border-radius: 6px; padding: 4px; font-size: 11px; overflow: hidden; }
      .cell .pic { height: 96px; display: flex; align-items: center; justify-content: center;
        background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0 / 12px 12px; }
      .cell canvas { max-width: 100%; max-height: 96px; }
      .cell .name { word-break: break-all; margin-top: 4px; }
      .cell .dim { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Gift Player Playground — inspect</h1>
    <div id="drop">Drop an SVGA file here, or pick one:
      <select id="sample"><option value="">— sample —</option></select>
    </div>
    <div id="error"></div>
    <table id="summary" hidden></table>
    <div id="warnings"></div>
    <div id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
